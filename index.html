<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow-up — LCCB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --ink:#16232E; --soft:#5C6B76; --line:#DFE4DD;
  --navy:#1A4C7A; --navy-soft:#E6EDF4;
  --sage:#2E6B52; --sage-soft:#E3EFE7;
  --amber:#8F5B12; --amber-soft:#F6ECDA;
  --rose:#8E2F38; --rose-soft:#F6E4E5;
  --on-navy:#FFFFFF;
  --shadow:0 1px 2px rgba(22,35,46,.08);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A20; --card:#18242C; --ink:#E8EEEA; --soft:#9AAAB4; --line:#27363F;
    --navy:#7FB2DD; --navy-soft:#1B2F42;
    --sage:#7FC69F; --sage-soft:#17332A;
    --amber:#E0AC5E; --amber-soft:#332715;
    --rose:#E8919A; --rose-soft:#381E22;
    --on-navy:#0E1A22; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#111A20; --card:#18242C; --ink:#E8EEEA; --soft:#9AAAB4; --line:#27363F;
  --navy:#7FB2DD; --navy-soft:#1B2F42;
  --sage:#7FC69F; --sage-soft:#17332A;
  --amber:#E0AC5E; --amber-soft:#332715;
  --rose:#E8919A; --rose-soft:#381E22;
  --on-navy:#0E1A22; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif; font-weight:700; margin:0; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:6px}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 120px}

/* header */
header{background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30}
.hdr{max-width:760px; margin:0 auto; padding:14px 16px 0}
.hdr h1{font-size:1.32rem; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.week{font-family:"Public Sans"; font-weight:400; font-size:.86rem; color:var(--soft)}
.tabs{display:flex; gap:2px; margin-top:12px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none; border:0; padding:9px 12px; color:var(--soft); font-weight:500; font-size:.94rem;
  border-bottom:2px solid transparent; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--navy)}
.tab .n{display:inline-block; min-width:20px; margin-left:5px; padding:0 6px; border-radius:20px;
  background:var(--navy-soft); color:var(--navy); font-size:.76rem; font-weight:600}

.banner{background:var(--amber-soft); color:var(--amber); font-size:.85rem; padding:8px 16px; text-align:center}

/* strip */
.strip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 8px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px 8px;
  text-align:left; box-shadow:var(--shadow)}
.stat b{display:block; font-family:"Bricolage Grotesque"; font-size:1.5rem; line-height:1.1}
.stat span{font-size:.72rem; color:var(--soft); display:block; margin-top:2px}
.stat.on{border-color:var(--navy); background:var(--navy-soft)}

/* sections */
section{margin-top:22px}
.sec-h{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.sec-h h2{font-size:1.02rem}
.sec-h p{margin:0; font-size:.82rem; color:var(--soft)}
.rule{height:3px; border-radius:3px; margin:6px 0 10px}
.r-due{background:var(--rose)} .r-noreply{background:var(--amber)}
.r-replied{background:var(--navy)} .r-back{background:var(--sage)} .r-none{background:var(--line)}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px;
  margin-bottom:8px; box-shadow:var(--shadow)}
.card .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.nm{font-weight:600; font-size:1rem; background:none; border:0; padding:0; text-align:left}
.nm:hover{text-decoration:underline}
.meta{font-size:.78rem; color:var(--soft); margin-top:1px; display:block}
.when{font-size:.76rem; color:var(--soft); white-space:nowrap; padding-top:2px}
.quote{margin:8px 0 0; font-size:.88rem; color:var(--soft); border-left:2px solid var(--line);
  padding-left:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 11px;
  font-size:.85rem; font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.btn.ok{background:var(--sage-soft); border-color:var(--sage-soft); color:var(--sage)}
.pill{display:inline-block; font-size:.7rem; font-weight:600; padding:2px 7px; border-radius:20px; margin-left:6px}
.p-due{background:var(--rose-soft); color:var(--rose)}
.p-int{background:var(--amber-soft); color:var(--amber)}
.p-in{background:var(--line); color:var(--soft)}

.empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--r); padding:16px;
  color:var(--soft); font-size:.9rem}

/* people */
.search{display:flex; gap:8px; margin:16px 0 10px; position:sticky; top:96px; z-index:20}
.search input{flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--card)}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--card); border-radius:20px; padding:6px 12px;
  font-size:.83rem; white-space:nowrap; color:var(--soft)}
.chip.on{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.row{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
  background:var(--card); border:0; border-bottom:1px solid var(--line); padding:11px 14px; text-align:left}
.list{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--card)}
.row:last-child{border-bottom:0}
.dot{width:8px; height:8px; border-radius:50%; flex:none}
.d-due{background:var(--rose)} .d-noreply{background:var(--amber)} .d-replied{background:var(--navy)}
.d-back{background:var(--sage)} .d-none{background:var(--line)}
.count{font-size:.8rem; color:var(--soft); margin:10px 2px}

/* week log */
.day{font-size:.8rem; color:var(--soft); margin:16px 0 6px; font-weight:600}
.entry{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; margin-bottom:7px}

/* modal */
.scrim{position:fixed; inset:0; background:rgba(12,22,30,.5); display:flex; align-items:flex-end;
  justify-content:center; z-index:60; padding:0}
.sheet{background:var(--card); width:100%; max-width:640px; max-height:92vh; overflow:auto;
  border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.scrim{align-items:center; padding:20px} .sheet{border-radius:16px}}
.sheet h2{font-size:1.15rem}
.sheet .sub{color:var(--soft); font-size:.85rem; margin:2px 0 14px}
label{display:block; font-size:.82rem; font-weight:600; margin:14px 0 5px}
input[type=text],input[type=date],textarea,select{width:100%; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--paper)}
textarea{min-height:76px; resize:vertical; font-family:inherit}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{flex:1; min-width:84px; border:1px solid var(--line); background:var(--paper); border-radius:10px; padding:9px}
.seg button.on{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.sheet .foot{display:flex; gap:8px; margin-top:20px}
.sheet .foot .btn{flex:1; padding:12px; text-align:center}
.close{float:right; border:0; background:none; font-size:1.4rem; color:var(--soft); line-height:1; padding:0 4px}
.tl{border-left:2px solid var(--line); margin:10px 0 0 6px; padding-left:14px}
.tl .it{margin-bottom:14px; position:relative}
.tl .it::before{content:""; position:absolute; left:-21px; top:6px; width:9px; height:9px; border-radius:50%;
  background:var(--line); border:2px solid var(--card)}
.tl .it.yes::before{background:var(--navy)} .tl .it.att::before{background:var(--sage)}
.tl .dt{font-size:.78rem; color:var(--soft)}
.tl .tx{font-size:.9rem; margin-top:2px; white-space:pre-wrap}
.pray{font-size:.85rem; color:var(--amber); margin-top:4px}
.fab{position:fixed; right:calc(50% - 380px + 16px); bottom:22px; z-index:40; border:0; border-radius:26px;
  background:var(--navy); color:var(--on-navy); font-weight:600; padding:14px 20px; box-shadow:0 4px 14px rgba(22,35,46,.25)}
@media(max-width:792px){.fab{right:16px}}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:88px; background:var(--ink); color:var(--paper);
  padding:10px 16px; border-radius:10px; font-size:.88rem; z-index:80; opacity:0; transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
.hint{font-size:.8rem; color:var(--soft); margin-top:6px}
</style>
</head>

/* ---------- state ---------- */
let db = null, downloads = null, localOnly = false, ready = false;
const state = {
  contacts: {},          // id -> {memberId,name,lastAttended,entries:[]}
  extras: [],            // people added by hand
  view: 'followups',
  focus: null,           // bucket filter on home
  query: '',
  chip: 'all',
  peopleLimit: 60
};

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return MON[+m-1]+' '+(+d); }
function fmtFull(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return MON[+m-1]+' '+(+d)+', '+y; }
function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/864e5); }
function ago(iso){ const n=daysBetween(iso,todayISO()); if(n<=0) return 'today'; if(n===1) return 'yesterday'; if(n<14) return n+' days ago'; return Math.floor(n/7)+' weeks ago'; }
function weekStart(iso){ const d=new Date(iso+'T00:00:00'); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off);
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

function people(){ return ROSTER.concat(state.extras); }
let PMAP = {};
function reindex(){ PMAP = {}; for(const p of people()) PMAP[p.id]=p; }
reindex();

function rec(id){ return state.contacts[id] || null; }
function entriesOf(id){ const r=rec(id); return r && r.entries ? r.entries.slice().sort((a,b)=>a.date<b.date?-1:1) : []; }
function lastEntry(id){ const e=entriesOf(id); return e.length? e[e.length-1] : null; }
function nextDue(id){ const e=entriesOf(id).map(x=>x.next).filter(Boolean).sort(); return e.length? e[e.length-1]:null; }

/* the five states of a conversation */
function bucket(id){
  const r=rec(id), last=lastEntry(id);
  if(!last) return 'none';
  const att = r && r.lastAttended;
  if(att && att >= last.date) return 'back';
  return last.replied ? 'replied' : 'noreply';
}
function isDue(id){
  const n=nextDue(id); if(!n) return false;
  if(n > todayISO()) return false;
  return bucket(id) !== 'back' || (rec(id).lastAttended < n);
}
function intermittent(id){
  const e=entriesOf(id), r=rec(id);
  return e.length>=2 && r && r.lastAttended;
}
function groupsOf(b){
  return people().filter(p=>bucket(p.id)===b).sort((a,b2)=>{
    const x=lastEntry(a.id), y=lastEntry(b2.id);
    return (x&&y) ? (x.date<y.date?1:-1) : 0;
  });
}

/* ---------- storage ---------- */
function lsKey(id){ return 'lccb:contact:'+id; }
async function persist(r){
  state.contacts[r.memberId]=r;
  if(db && !localOnly){
    try { await db.doc('contacts/'+r.memberId).set(r); return; }
    catch(e){ console.warn('db write failed', e); }
  }
  try { localStorage.setItem(lsKey(r.memberId), JSON.stringify(r)); } catch(e){}
}
async function persistExtras(){
  if(db && !localOnly){
    try { await db.doc('roster/extras').set({people:state.extras}); return; } catch(e){ console.warn(e); }
  }
  try { localStorage.setItem('lccb:extras', JSON.stringify(state.extras)); } catch(e){}
}
function loadLocal(){
  try{
    const ex=localStorage.getItem('lccb:extras');
    if(ex) state.extras=JSON.parse(ex)||[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith('lccb:contact:')){
        const r=JSON.parse(localStorage.getItem(k)); if(r&&r.memberId) state.contacts[r.memberId]=r;
      }
    }
  }catch(e){}
  reindex();
}

async function boot(){
  loadLocal();
  render();
  try { db = await claude.use('db'); } catch(e){ db=null; }
  try { downloads = await claude.use('downloads'); } catch(e){ downloads=null; }
  if(!db){
    localOnly = true;
    const b=$('#banner'); b.hidden=false;
    b.textContent='Saved on this device only — shared saving is unavailable right now.';
    seedLocalIfEmpty();
    ready=true; render(); return;
  }
  try{
    const flag = await db.doc('meta/import').get();
    if(!flag.exists) await importSeed();
  }catch(e){ console.warn('seed check', e); }

  db.collection('contacts').onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{ const v=d.data(); if(v && v.memberId) next[v.memberId]=v; });
    state.contacts=next; ready=true; render();
  }, err=>{ console.warn('contacts sub', err); });

  db.doc('roster/extras').onSnapshot(d=>{
    const v=d.exists? d.data():null;
    state.extras = (v && Array.isArray(v.people)) ? v.people : [];
    reindex(); render();
  }, err=>{ console.warn('extras sub', err); });
}

function seedLocalIfEmpty(){
  if(Object.keys(state.contacts).length) return;
  state.extras = SEED.extras.slice();
  SEED.contacts.forEach(c=>{ state.contacts[c.memberId]=c; });
  reindex();
  try{
    localStorage.setItem('lccb:extras', JSON.stringify(state.extras));
    SEED.contacts.forEach(c=>localStorage.setItem(lsKey(c.memberId), JSON.stringify(c)));
  }catch(e){}
}
async function importSeed(){
  try{
    await db.doc('roster/extras').set({people:SEED.extras});
    for(const c of SEED.contacts){ await db.doc('contacts/'+c.memberId).set(c); }
    await db.doc('meta/import').set({done:true, at:todayISO()});
  }catch(e){ console.warn('import failed', e); }
}

/* ---------- render ---------- */
function render(){
  const m=$('#main');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.view===state.view)));
  const due=people().filter(p=>isDue(p.id)).length;
  const noreply=groupsOf('noreply').length, replied=groupsOf('replied').length;
  $('#nFollow').textContent = due+noreply+replied;
  const ws=weekStart(todayISO());
  const weekEntries=[];
  for(const p of people()) for(const e of entriesOf(p.id)) if(e.date>=ws) weekEntries.push({p,e});
  $('#nWeek').textContent = weekEntries.length;
  $('#weekLabel').textContent = 'week of '+fmt(ws);

  if(state.view==='followups') m.innerHTML = viewFollow(due,noreply,replied);
  else if(state.view==='people') m.innerHTML = viewPeople();
  else m.innerHTML = viewWeek(weekEntries, ws);
}

function card(p, note){
  const b=bucket(p.id), last=lastEntry(p.id), r=rec(p.id);
  const pills = (isDue(p.id)?'<span class="pill p-due">Due '+fmt(nextDue(p.id))+'</span>':'')
    + (intermittent(p.id)?'<span class="pill p-int">On and off</span>':'')
    + (p.flag==='Inactive'?'<span class="pill p-in">Marked inactive</span>':'');
  const sub=[p.group,p.role,p.area].filter(Boolean).join(' · ');
  const quote = last && last.replied && last.reply ? '<p class="quote">'+esc(last.reply)+'</p>' : '';
  return '<article class="card"><div class="top"><div>'
    + '<button class="nm" data-person="'+p.id+'">'+esc(p.name)+'</button>'+pills
    + '<div class="meta">'+esc(sub||'No group listed')+'</div></div>'
    + '<div class="when">'+esc(note|| (last? ago(last.date):'never contacted'))+'</div></div>'
    + quote
    + '<div class="acts">'
    + '<button class="btn pri" data-log="'+p.id+'">Log a follow-up</button>'
    + (b!=='back' && last ? '<button class="btn ok" data-came="'+p.id+'">Came to church</button>' : '')
    + '</div></article>';
}

function section(title, hint, cls, list, emptyMsg){
  let h='<section><div class="sec-h"><h2>'+title+'</h2><p>'+hint+'</p></div><div class="rule '+cls+'"></div>';
  h += list.length ? list.join('') : '<div class="empty">'+emptyMsg+'</div>';
  return h+'</section>';
}

function viewFollow(due,noreply,replied){
  const dueList=people().filter(p=>isDue(p.id));
  const back=groupsOf('back').filter(p=>daysBetween(rec(p.id).lastAttended, todayISO())<=21);
  const f=state.focus;
  const strip='<div class="strip">'
    + stat('due',dueList.length,'Due now')
    + stat('noreply',noreply,'No reply')
    + stat('replied',replied,'Replied, not back')
    + stat('back',back.length,'Came back')
    + '</div>';
  let out=strip;
  if(!f||f==='due') out+=section('Due now','you planned to reach out by today','r-due',
      dueList.map(p=>card(p,'due '+fmt(nextDue(p.id)))), 'Nothing scheduled for today. Set a next date when you log a follow-up.');
  if(!f||f==='noreply') out+=section('Waiting on a reply','followed up, no answer yet','r-noreply',
      groupsOf('noreply').map(p=>card(p)), 'Everyone you followed up has answered.');
  if(!f||f==='replied') out+=section('Replied, not back yet','they answered you but have not come to church since','r-replied',
      groupsOf('replied').map(p=>card(p)), 'No one is in this state right now.');
  if(!f||f==='back') out+=section('Came back','attended after your follow-up, in the last 3 weeks','r-back',
      back.map(p=>card(p,'came '+fmt(rec(p.id).lastAttended))), 'No returns logged in the last 3 weeks.');
  return out;
}
function stat(key,n,label){
  return '<button class="stat'+(state.focus===key?' on':'')+'" data-focus="'+key+'"><b>'+n+'</b><span>'+label+'</span></button>';
}

const CHIPS=[['all','Everyone'],['todo','Needs follow-up'],['never','Not contacted yet'],
  ['Yamo','Yamo'],['Youth','Youth'],['Ladies','Ladies'],['Men','Men'],['Kids','Kids'],['inactive','Marked inactive']];
function viewPeople(){
  const q=state.query.trim().toLowerCase();
  let list=people().filter(p=>{
    if(q && !(p.name.toLowerCase().includes(q) || (p.area||'').toLowerCase().includes(q))) return false;
    const c=state.chip;
    if(c==='all') return true;
    if(c==='todo') return ['noreply','replied'].includes(bucket(p.id)) || isDue(p.id);
    if(c==='never') return bucket(p.id)==='none';
    if(c==='inactive') return p.flag==='Inactive';
    return p.group===c;
  });
  list.sort((a,b)=>a.name.localeCompare(b.name));
  const total=list.length;
  const shown=list.slice(0, state.peopleLimit);
  let h='<div class="search"><input id="q" type="text" placeholder="Search a name or area" value="'+esc(state.query)+'" autocomplete="off"></div>'
    + '<div class="chips">'+CHIPS.map(([k,l])=>'<button class="chip'+(state.chip===k?' on':'')+'" data-chip="'+k+'">'+l+'</button>').join('')+'</div>'
    + '<p class="count">'+total+' '+(total===1?'person':'people')+'</p><div class="list">';
  h += shown.map(p=>{
    const b=bucket(p.id), last=lastEntry(p.id);
    const sub=[p.group,p.area].filter(Boolean).join(' · ') || 'No group listed';
    return '<button class="row" data-person="'+p.id+'"><span class="dot '+(isDue(p.id)?'d-due':'d-'+b)+'"></span>'
      + '<span style="flex:1"><span style="font-weight:600">'+esc(p.name)+'</span>'
      + '<span class="meta">'+esc(sub)+'</span></span>'
      + '<span class="when">'+(last?ago(last.date):'—')+'</span></button>';
  }).join('') || '<div class="empty" style="border:0">No one matches that. Try another name or area.</div>';
  h += '</div>';
  if(total>shown.length) h+='<div class="acts"><button class="btn" id="more">Show more ('+(total-shown.length)+' left)</button></div>';
  h += '<div class="acts"><button class="btn" id="addPerson">Add someone not on the list</button>'
     + '<button class="btn" id="exportCsv">Export all follow-ups</button></div>';
  return h;
}

function viewWeek(weekEntries, ws){
  if(!weekEntries.length) return '<div class="empty" style="margin-top:20px">Nothing logged since '+fmt(ws)
    + '. Tap “Log a follow-up” after you message or visit someone.</div>';
  weekEntries.sort((a,b)=>a.e.date<b.e.date?1:-1);
  let h='', day='';
  for(const {p,e} of weekEntries){
    if(e.date!==day){ day=e.date; h+='<p class="day">'+fmtFull(day)+'</p>'; }
    h+='<div class="entry"><div class="top" style="display:flex;justify-content:space-between;gap:10px">'
      + '<button class="nm" data-person="'+p.id+'">'+esc(p.name)+'</button>'
      + '<span class="when">'+esc(e.method)+(e.replied?' · replied':' · no reply')+'</span></div>'
      + (e.reply?'<p class="quote">'+esc(e.reply)+'</p>':'')
      + (e.prayer?'<p class="pray">Prayer: '+esc(e.prayer)+'</p>':'')
      + '</div>';
  }
  return h+'<div class="acts"><button class="btn" id="exportCsv">Export all follow-ups</button></div>';
}

/* ---------- sheets ---------- */
function openSheet(html){
  const s=document.createElement('div'); s.className='scrim'; s.id='scrim';
  s.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(s);
  s.addEventListener('click', e=>{ if(e.target===s) closeSheet(); });
  const f=s.querySelector('input,textarea,button'); if(f) f.focus();
}
function closeSheet(){ const s=$('#scrim'); if(s) s.remove(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

function personSheet(id){
  const p=PMAP[id]; if(!p) return;
  const r=rec(id), es=entriesOf(id).slice().reverse();
  const sub=[p.group,p.role,p.area].filter(Boolean).join(' · ')||'No group listed';
  let tl='';
  if(r && r.lastAttended) tl+='<div class="it att"><div class="dt">'+fmtFull(r.lastAttended)+'</div><div class="tx">Came to church</div></div>';
  tl+=es.map(e=>'<div class="it'+(e.replied?' yes':'')+'"><div class="dt">'+fmtFull(e.date)+' · '+esc(e.method)
    +(e.replied?' · replied':' · no reply')+(e.next?' · next '+fmt(e.next):'')+'</div>'
    + (e.reply?'<div class="tx">'+esc(e.reply)+'</div>':'')
    + (e.prayer?'<div class="pray">Prayer: '+esc(e.prayer)+'</div>':'')+'</div>').join('');
  if(!tl) tl='<div class="it"><div class="tx" style="color:var(--soft)">No follow-up logged yet.</div></div>';
  openSheet('<button class="close" data-close>&times;</button><h2>'+esc(p.name)+'</h2>'
    + '<p class="sub">'+esc(sub)+'</p>'
    + '<div class="acts"><button class="btn pri" data-log="'+id+'">Log a follow-up</button>'
    + '<button class="btn ok" data-came="'+id+'">Came to church</button></div>'
    + '<div class="tl">'+tl+'</div>');
}

function logSheet(id){
  const p=PMAP[id];
  const opts=people().slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(x=>'<option value="'+x.id+'"'+(x.id===id?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  openSheet('<button class="close" data-close>&times;</button><h2>Log a follow-up</h2>'
    + '<p class="sub">'+(p?esc(p.name):'Pick who you reached out to')+'</p>'
    + (p?'<input type="hidden" id="pid" value="'+id+'">':'<label for="pick">Person</label><select id="pick">'+opts+'</select>')
    + '<label for="date">Date</label><input type="date" id="date" value="'+todayISO()+'">'
    + '<label>How</label><div class="seg" id="method">'
      + '<button data-m="Message" class="on">Message</button><button data-m="Call">Call</button><button data-m="Visit">Visit</button></div>'
    + '<label>Did they reply?</label><div class="seg" id="replied">'
      + '<button data-r="no" class="on">Not yet</button><button data-r="yes">Yes, they replied</button></div>'
    + '<label for="reply">What they said</label><textarea id="reply" placeholder="Paste or summarise their reply"></textarea>'
    + '<label for="prayer">Prayer request</label><textarea id="prayer" style="min-height:56px"></textarea>'
    + '<label for="next">Follow up again on</label><input type="date" id="next">'
    + '<p class="hint">Leave blank if you have no date in mind — they stay in the waiting list either way.</p>'
    + '<div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="saveLog">Save follow-up</button></div>');
}

function cameSheet(id){
  const p=PMAP[id];
  openSheet('<button class="close" data-close>&times;</button><h2>Came to church</h2>'
    + '<p class="sub">'+esc(p.name)+'</p>'
    + '<label for="adate">Which Sunday</label><input type="date" id="adate" value="'+lastSunday()+'">'
    + '<div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="saveCame" data-id="'+id+'">Save</button></div>');
}
function lastSunday(){ const d=new Date(); d.setDate(d.getDate()-d.getDay());
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

function addSheet(){
  openSheet('<button class="close" data-close>&times;</button><h2>Add someone</h2>'
    + '<p class="sub">For people not in the church list yet</p>'
    + '<label for="an">Name</label><input type="text" id="an" autocomplete="off">'
    + '<label for="ag">Group</label><select id="ag"><option value="">Not set</option><option>Yamo</option><option>Youth</option><option>Ladies</option><option>Men</option><option>Kids</option></select>'
    + '<label for="aa">Area</label><input type="text" id="aa" autocomplete="off">'
    + '<div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="saveAdd">Add person</button></div>');
}

/* ---------- actions ---------- */
async function saveLog(){
  const id = $('#pid') ? $('#pid').value : $('#pick').value;
  const p = PMAP[id]; if(!p) return;
  const date = $('#date').value || todayISO();
  const method = $('#method .on').dataset.m;
  const replied = $('#replied .on').dataset.r === 'yes';
  const reply = $('#reply').value.trim();
  const prayer = $('#prayer').value.trim();
  const next = $('#next').value || null;
  const r = rec(id) || {memberId:id, name:p.name, lastAttended:null, entries:[]};
  const copy = {memberId:id, name:p.name, lastAttended:r.lastAttended||null, entries:r.entries.slice()};
  copy.entries.push({id:'e'+Date.now(), date, method, replied, reply, prayer, next});
  closeSheet();
  await persist(copy); render(); toast('Follow-up saved');
}
async function saveCame(id){
  const p=PMAP[id]; if(!p) return;
  const d=$('#adate').value || todayISO();
  const r = rec(id) || {memberId:id, name:p.name, lastAttended:null, entries:[]};
  const copy = {memberId:id, name:p.name, lastAttended:d, entries:r.entries.slice()};
  closeSheet();
  await persist(copy); render(); toast(p.name.split(' ')[0]+' marked as back');
}
async function saveAdd(){
  const name=$('#an').value.trim(); if(!name){ toast('Type a name first'); return; }
  const id='x-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,5);
  state.extras=state.extras.concat([{id,name,group:$('#ag').value,area:$('#aa').value.trim(),role:'',flag:'',added:true}]);
  reindex(); closeSheet(); await persistExtras(); render(); toast(name+' added');
}
async function exportCsv(){
  const rows=[['Name','Group','Area','Date','How','Replied','What they said','Prayer request','Next follow-up','Last attended']];
  for(const p of people()){
    const r=rec(p.id); if(!r) continue;
    for(const e of entriesOf(p.id))
      rows.push([p.name,p.group||'',p.area||'',e.date,e.method,e.replied?'Yes':'No',e.reply||'',e.prayer||'',e.next||'',r.lastAttended||'']);
  }
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  if(!downloads){ toast('Export is not available here'); return; }
  try{ await downloads.save({filename:'follow-ups-'+todayISO()+'.csv', data:csv}); }
  catch(err){ if(err && err.code==='declined') return; toast('Could not export just now'); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-view],[data-person],[data-log],[data-came],[data-focus],[data-chip],[data-close],[data-m],[data-r],#fab,#more,#addPerson,#exportCsv,#saveLog,#saveCame,#saveAdd');
  if(!t) return;
  if(t.dataset.view){ state.view=t.dataset.view; state.focus=null; render(); return; }
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  if(t.dataset.m){ t.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); t.classList.add('on'); return; }
  if(t.dataset.r){ t.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); t.classList.add('on'); return; }
  if(t.dataset.focus){ state.focus = state.focus===t.dataset.focus ? null : t.dataset.focus; render(); return; }
  if(t.dataset.chip){ state.chip=t.dataset.chip; state.peopleLimit=60; render(); return; }
  if(t.dataset.log){ closeSheet(); logSheet(t.dataset.log); return; }
  if(t.dataset.came){ closeSheet(); cameSheet(t.dataset.came); return; }
  if(t.dataset.person){ personSheet(t.dataset.person); return; }
  if(t.id==='fab'){ logSheet(null); return; }
  if(t.id==='more'){ state.peopleLimit+=120; render(); return; }
  if(t.id==='addPerson'){ addSheet(); return; }
  if(t.id==='exportCsv'){ exportCsv(); return; }
  if(t.id==='saveLog'){ saveLog(); return; }
  if(t.id==='saveCame'){ saveCame(t.dataset.id); return; }
  if(t.id==='saveAdd'){ saveAdd(); return; }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){
    state.query=e.target.value; state.peopleLimit=60;
    const pos=e.target.selectionStart; render();
    const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

boot();
</script>
</body>
</html>
